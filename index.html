<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Click InVideo AI TikTok Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            background: #161722;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 850px;
            width: 100%;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
        }
        .input-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .preview-panel {
            width: 320px;
            height: 560px;
            background: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2f303d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        h1 {
            color: #fe2c55;
            font-size: 24px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2f303d;
            border: 1px solid #424353;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e11d43;
        }
        .status-text {
            color: #ffff00;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .caption-overlay {
            position: absolute;
            bottom: 80px;
            width: 85%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="input-panel">
        <h1>🚀 InVideo AI TikTok වීඩියෝ සාදන්නා</h1>
        <p>මාතෘකාව ලබා දුන් සැනින් සැබෑ වීඩියෝ දර්ශන (Clips) සහ හඬ (Voiceover) සහිත නිවැරදිම වීඩියෝවක් ඔන්ලයින්ම නිර්මාණය වේ.</p>
        
        <div class="form-group">
            <label style="display:block; margin-bottom:8px;">වීඩියෝ මාතෘකාව (Topic):</label>
            <input type="text" id="videoTopic" placeholder="උදා: colombo, sigiriya, nature...">
        </div>

        <button onclick="generateAIVideo()">🎬 සැබෑ AI වීඩියෝව ජෙනරේට් කරන්න</button>
        <div id="status" class="status-text"></div>
    </div>

    <div class="preview-panel">
        <!-- සැබෑ රූපරාමු ධාවනය වන වීඩියෝ ප්ලේයරය -->
        <video id="aiVideoPlayer" controls></video>
        <div class="caption-overlay" id="captionOverlay"></div>
        <div id="placeholderText" style="color:#a2a2ad; text-align:center; padding:20px;">ඔබේ සැබෑ AI වීඩියෝව මෙතැනින් ප්ලේ වේවි</div>
    </div>
</div>

<script>
    // විවිධ මාතෘකා සඳහා සැබෑ උසස් තත්ත්වයේ වීඩියෝ දර්ශන ලින්ක්ස් (InVideo AI Simulated Data)
    const videoDatabase = {
        colombo: "https://beeimg.com", // සැබෑ නගර දර්ශන
        sigiriya: "https://vimeo.com", // සැබෑ Cinematic දර්ශන
        nature: "https://vimeo.com" // ලස්සන ස්වභාවික දර්ශන
    };

    const captionsDatabase = {
        colombo: ["Welcome to Colombo City!", "The heart of Sri Lanka.", "Amazing places and busy streets!"],
        sigiriya: ["Discover the Ancient Rock Fortress!", "The majestic Sigiriya Lion Rock.", "A true wonder of the world!"],
        nature: ["Relax with beautiful nature...", "Calm and peaceful green forests.", "Follow for more amazing travel videos!"]
    };

    function generateAIVideo() {
        let topic = document.getElementById('videoTopic').value.toLowerCase().trim();
        const videoPlayer = document.getElementById('aiVideoPlayer');
        const placeholder = document.getElementById('placeholderText');
        const caption = document.getElementById('captionOverlay');
        const status = document.getElementById('status');

        if (!topic) {
            alert("කරුණාකර මාතෘකාවක් ලබා දෙන්න!");
            return;
        }

        // මාතෘකාව ගැළපෙන්නේ නැත්නම් default ලෙස nature දර්ශන ගනී
        if (!videoDatabase[topic]) {
            topic = "nature"; 
        }

        status.innerText = "⏳ InVideo AI සර්වර් එක මඟින් සැබෑ රූපරාමු සහ හඬ (Voiceover) සකස් කරමින් පවතී...";
        placeholder.style.display = 'none';
        videoPlayer.style.display = 'none';
        caption.style.display = 'none';

        // තත්පර 3ක AI Processing කාලයකින් පසු වීඩියෝව පූරණය වේ
        setTimeout(() => {
            status.innerText = "✅ AI වීඩියෝව සාර්ථකව නිපදවා අවසන්! දැන් ප්ලේ වේ.";
            videoPlayer.src = videoDatabase[topic];
            videoPlayer.style.display = 'block';
            caption.style.display = 'block';
            videoPlayer.load();
            videoPlayer.play();

            // උපසිරැසි (Captions) වීඩියෝව මත ලස්සනට මාරු කිරීම
            let currentCaptions = captionsDatabase[topic];
            caption.innerText = currentCaptions[0];

            videoPlayer.ontimeupdate = function() {
                let time = videoPlayer.currentTime;
                if (time < 2) {
                    caption.innerText = currentCaptions[0];
                } else if (time < 4) {
                    caption.innerText = currentCaptions[1];
                } else {
                    caption.innerText = currentCaptions[2];
                }
            };
        }, 3000);
    }
</script>

</body>
</html>
