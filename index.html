<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Click TikTok Video Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            background: #161722;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
        }
        .input-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .preview-panel {
            width: 320px;
            height: 560px;
            background: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2f303d;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }
        h1 {
            color: #fe2c55;
            font-size: 24px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2f303d;
            border: 1px solid #424353;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .status-text {
            color: #ffff00;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="input-panel">
        <h1>🚀 සැබෑ One-Click වීඩියෝ සාදන්නා</h1>
        <p>මාතෘකාව ඇතුළත් කර බටන් එක ඔබන්න. සැබෑ වීඩියෝවක් මෙතැනින්ම සකස් වී බාගත වේ.</p>
        
        <div class="form-group">
            <label>වීඩියෝ මාතෘකාව (Topic):</label>
            <input type="text" id="videoTopic" placeholder="ලංකාවේ ලස්සනම තැන්...">
        </div>

        <button onclick="startGenerating()">🎬 වීඩියෝව නිපදවන්න සහ බාගත කරන්න</button>
        <div id="status" class="status-text"></div>
    </div>

    <div class="preview-panel">
        <canvas id="videoCanvas" width="720" height="1280"></canvas>
    </div>
</div>

<script>
    function startGenerating() {
        const topic = document.getElementById('videoTopic').value || "මගේ වීඩියෝව";
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        
        status.innerText = "⏳ වීඩියෝව සකස් වෙමින් පවතී... (කරුණාකර රැඳී සිටින්න)";
        
        // වෙබ් සේවාදායකයක (Server) පවතින බැවින් මෙම පටිගත කිරීමේ තාක්ෂණය දැන් බ්‍රවුසරයේ ක්‍රියා කරයි
        const stream = canvas.captureStream(30); 
        let mediaRecorder;
        
        // බ්‍රවුසරය අනුව සහය දක්වන Video Format එක තෝරාගැනීම
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        } else {
            mediaRecorder = new MediaRecorder(stream);
        }
        
        const chunks = [];
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tiktok_video.webm';
            a.click();
            status.innerText = "✅ වීඩියෝව සාර්ථකව බාගත විය!";
        };

        mediaRecorder.start();

        let frame = 0;
        const interval = setInterval(() => {
            // පසුබිම් වර්ණ සංකලනය (Dynamic Background Animation)
            let hue = (frame * 3) % 360;
            ctx.fillStyle = `hsl(${hue}, 70%, 30%)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // මැද ඇති සිංහල මාතෘකාව ඇඳීම
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 48px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(topic, canvas.width / 2, canvas.height / 2 - 50);
            
            // මාරු වන උපසිරැසි අකුරු
            const captions = ["අද මම ගෙනාවේ...", "විශේෂ රහසක්!", "දැන්ම බලලා Share කරන්න!"];
            let currentCaption = captions[Math.floor(frame / 45) % captions.length];
            ctx.fillStyle = "#ffff00";
            ctx.font = "40px sans-serif";
            ctx.fillText(currentCaption, canvas.width / 2, canvas.height / 2 + 50);

            frame++;
            if (frame > 135) { // තත්පර 4.5ක වීඩියෝවක්
                clearInterval(interval);
                mediaRecorder.stop();
            }
        }, 1000 / 30);
    }
</script>

</body>
</html>
