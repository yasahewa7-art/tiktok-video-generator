<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Click TikTok Video Generator v2</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            background: #161722;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 850px;
            width: 100%;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
        }
        .input-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .preview-panel {
            width: 320px;
            height: 560px;
            background: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2f303d;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        h1 {
            color: #fe2c55;
            font-size: 24px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #2f303d;
            border: 1px solid #424353;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e11d43;
        }
        .status-text {
            color: #ffff00;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
        /* Hidden video element used for rendering source */
        #sourceVideo {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="input-panel">
        <h1>🚀 සැබෑ රූපරාමු සහිත TikTok සාදන්නා</h1>
        <p>මාතෘකාවක් දෙන්න. අවශ්‍ය නම් පින්තූරයක්/වීඩියෝවක් අප්ලෝඩ් කරන්න. නැතහොත් ඔටෝමැටිකලි ඉන්ටර්නෙට් එකෙන් වීඩියෝ ලබාගනී!</p>
        
        <div class="form-group">
            <label>1. වීඩියෝ මාතෘකාව (Topic):</label>
            <input type="text" id="videoTopic" placeholder="ලංකාවේ ලස්සනම තැන්...">
        </div>

        <div class="form-group">
            <label>2. ඔබේම පසුබිම් රූපයක් (කැමති නම් පමණක්):</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <button onclick="prepareMedia()">🎬 වීඩියෝව නිපදවන්න සහ බාගත කරන්න</button>
        <div id="status" class="status-text"></div>
    </div>

    <div class="preview-panel">
        <canvas id="videoCanvas" width="720" height="1280"></canvas>
    </div>
</div>

<!-- Standard Background Video from Internet -->
<video id="sourceVideo" crossorigin="anonymous" loop muted></video>

<script>
    // Copyright-Free සැබෑ Cinematic වීඩියෝවක් (Pexels හරහා)
    const defaultVideoUrl = "https://vimeo.com";
    let uploadedImage = null;

    // පරිශීලකයා පින්තූරයක් අප්ලෝඩ් කළහොත් එය කියවීම
    document.getElementById('imageUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImage = new Image();
                uploadedImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    function prepareMedia() {
        const status = document.getElementById('status');
        const videoEl = document.getElementById('sourceVideo');

        // පරිශීලකයා පින්තූරයක් අප්ලෝඩ් කර නොමැති නම්, ඉන්ටර්නෙට් වීඩියෝව සක්‍රීය කරයි
        if (!uploadedImage) {
            status.innerText = "🌐 පසුබිම් වීඩියෝව අන්තර්ජාලයෙන් ලබාගනිමින් පවතී...";
            videoEl.src = defaultVideoUrl;
            videoEl.load();
            videoEl.onloadeddata = function() {
                videoEl.play();
                startGenerating();
            };
        } else {
            startGenerating();
        }
    }

    function startGenerating() {
        const topic = document.getElementById('videoTopic').value || "මගේ වීඩියෝව";
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const videoEl = document.getElementById('sourceVideo');
        
        status.innerText = "⏳ වීඩියෝව රෙන්ඩර් වෙමින් පවතී... (තත්පර 5ක් රැඳී සිටින්න)";
        
        const stream = canvas.captureStream(30); 
        let mediaRecorder;
        
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        } else {
            mediaRecorder = new MediaRecorder(stream);
        }
        
        const chunks = [];
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tiktok_real_video.webm';
            a.click();
            status.innerText = "✅ වීඩියෝව සාර්ථකව බාගත විය! බ්‍රවුසරයට Drag කර බලන්න.";
            videoEl.pause();
        };

        mediaRecorder.start();

        let frame = 0;
        const interval = setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. පසුබිම ඇඳීම (අප්ලෝඩ් කළ රූපය හෝ ඉන්ටර්නෙට් සැබෑ වීඩියෝව)
            if (uploadedImage) {
                // පින්තූරය 9:16 රාමුවට ගැලපෙන සේ ඇඳීම
                ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
            } else {
                // සැබෑ චලනය වන වීඩියෝව කැන්වසය මත ඇඳීම
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            }
            
            // වීඩියෝව වඩාත් පැහැදිලිව පෙනීමට කළු පැහැති සියුම් තට්ටුවක් (Overlay) දැමීම
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. ප්‍රධාන සිංහල මාතෘකාව ඇඳීම
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 52px sans-serif";
            ctx.textAlign = "center";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 10;
            ctx.fillText(topic, canvas.width / 2, canvas.height / 2 - 60);
            
            // 3. මාරු වන උපසිරැසි (Captions) ඇඳීම
            const captions = ["අද ඔයාලට ගෙනාවේ...", "විශේෂම වීඩියෝවක්!", "ලයික් එකක් දාලා සපෝට් කරන්න!"];
            let currentCaption = captions[Math.floor(frame / 45) % captions.length];
            ctx.fillStyle = "#ffff00";
            ctx.font = "bold 42px sans-serif";
            ctx.fillText(currentCaption, canvas.width / 2, canvas.height / 2 + 60);
            
            ctx.shadowBlur = 0; // Reset shadow

            frame++;
            if (frame > 150) { // තත්පර 5ක සැබෑ වීඩියෝවක්
                clearInterval(interval);
                mediaRecorder.stop();
            }
        }, 1000 / 30);
    }
</script>

</body>
</html>
