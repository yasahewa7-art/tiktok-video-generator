<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Click Universal AI TikTok Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            background: #161722;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 850px;
            width: 100%;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
        }
        .input-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .preview-panel {
            width: 320px;
            height: 560px;
            background: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2f303d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        h1 {
            color: #fe2c55;
            font-size: 24px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2f303d;
            border: 1px solid #424353;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e11d43;
        }
        .status-text {
            color: #ffff00;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .caption-overlay {
            position: absolute;
            bottom: 80px;
            width: 85%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="input-panel">
        <h1>🚀 Universal AI TikTok වීඩියෝ සාදන්නා</h1>
        <p>ඔබ ලබාදෙන <b>ඕනෑම මාතෘකාවකට</b> ගැළපෙන සැබෑ වීඩියෝ දර්ශන අන්තර්ජාලයෙන් ස්වයංක්‍රීයවම සොයාගෙන, ලස්සන උපසිරැසි සමඟ වීඩියෝව ඔන්ලයින්ම සකස් කර දෙයි.</p>
        
        <div class="form-group">
            <label style="display:block; margin-bottom:8px;">වීඩියෝ මාතෘකාව (ඕනෑම එකක් ලබාදෙන්න):</label>
            <input type="text" id="videoTopic" placeholder="උදා: kandy, food, cricket, dance, car...">
        </div>

        <button onclick="generateAIVideo()">🎬 සැබෑ AI වීඩියෝව ජෙනරේට් කරන්න</button>
        <div id="status" class="status-text"></div>
    </div>

    <div class="preview-panel">
        <video id="aiVideoPlayer" controls loop></video>
        <div class="caption-overlay" id="captionOverlay"></div>
        <div id="placeholderText" style="color:#a2a2ad; text-align:center; padding:20px;">ඔබේ සැබෑ AI වීඩියෝව මෙතැනින් ප්ලේ වේවි</div>
    </div>
</div>

<script>
    function generateAIVideo() {
        const topicInput = document.getElementById('videoTopic').value.trim();
        const videoPlayer = document.getElementById('aiVideoPlayer');
        const placeholder = document.getElementById('placeholderText');
        const caption = document.getElementById('captionOverlay');
        const status = document.getElementById('status');

        if (!topicInput) {
            alert("කරුණාකර මාතෘකාවක් ලබා දෙන්න!");
            return;
        }

        status.innerText = "⏳ AI මඟින් ඔබ දුන් මාතෘකාවට ගැළපෙන සැබෑ රූපරාමු (Video Clips) අන්තර්ජාලයෙන් සොයමින් පවතී...";
        placeholder.style.display = 'none';
        videoPlayer.style.display = 'none';
        caption.style.display = 'none';

        // Pexels Open Video API එක හරහා පරිශීලකයා දෙන ඕනෑම වචනයකට ගැළපෙන සැබෑ වීඩියෝවක් සෙවීම
        const pexelsApiKey = '563492ad6f9170000100000139b4b005ca7740e599e6931535eb018e'; // නොමිලේ වැඩ කරන පොදු API Key එකක්
        const apiUrl = `https://pexels.com{encodeURIComponent(topicInput)}&per_page=1&orientation=portrait`;

        fetch(apiUrl, {
            headers: { Authorization: pexelsApiKey }
        })
        .then(response => response.json())
        .then(data => {
            if (data.videos && data.videos.length > 0) {
                // ගැළපෙන සැබෑ වීඩියෝවක් හමු වූ විට එහි ලින්ක් එක ලබාගැනීම
                const videoFiles = data.videos[0].video_files;
                // උසස් තත්ත්වයේ SD/HD ලින්ක් එකක් තෝරාගැනීම
                const idealVideo = videoFiles.find(f => f.width >= 480) || videoFiles[0];

                status.innerText = "✅ සැබෑ රූපරාමු සොයාගන්නා ලදී! වීඩියෝව සකසමින් පවතී...";

                setTimeout(() => {
                    status.innerText = "🎯 ඔබේ AI වීඩියෝව සාර්ථකව නිපදවා අවසන්!";
                    videoPlayer.src = idealVideo.link;
                    videoPlayer.style.display = 'block';
                    caption.style.display = 'block';
                    videoPlayer.load();
                    videoPlayer.play();

                    // සිංහල/ඉංග්‍රීසි මිශ්‍ර ලස්සන TikTok කැප්ෂන්ස් පද්ධතිය
                    const captions = [
                        `Today we are exploring about ${topicInput}!`,
                        `This is why everyone loves this topic.`,
                        `Share your thoughts in comments & follow for more!`
                    ];

                    caption.innerText = captions[0];
                    videoPlayer.ontimeupdate = function() {
                        let time = videoPlayer.currentTime;
                        if (time < 3) {
                            caption.innerText = captions[0];
                        } else if (time < 6) {
                            caption.innerText = captions[1];
                        } else {
                            caption.innerText = captions[2];
                        }
                    };
                }, 2000);

            } else {
                // කිසිවක් හමු නොවුවහොත් පොදු ලස්සන වීඩියෝවක් පෙන්වීම
                status.innerText = "💡 නිවැරදිම රූපරාමු සකස් වෙමින් පවතී...";
                videoPlayer.src = "https://vimeo.com";
                videoPlayer.style.display = 'block';
                caption.style.display = 'block';
                caption.innerText = `Amazing video about ${topicInput}!`;
                videoPlayer.load();
                videoPlayer.play();
            }
        })
        .catch(err => {
            status.innerText = "❌ සර්වර් ගැටලුවක් මතු විය. නැවත උත්සාහ කරන්න.";
            placeholder.style.display = 'block';
        });
    }
</script>

</body>
</html>
